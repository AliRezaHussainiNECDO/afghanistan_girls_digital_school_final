workflows:
  ios-release:
    name: iOS Release (App Store Connect)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI Admin
    environment:
      vars:
        APP_STORE_APPLE_ID: 6799480851
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Re-enable code signing for Release config (undo GitHub Actions unsigned-build override)
        script: |
          sed -i '' '/CODE_SIGNING_ALLOWED=NO/d; /CODE_SIGNING_REQUIRED=NO/d; /CODE_SIGN_IDENTITY=$/d' ios/Flutter/Release.xcconfig
          cat ios/Flutter/Release.xcconfig
      - name: Generate iOS Flutter config (Generated.xcconfig)
        script: |
          flutter precache --ios
          flutter build ios --release --no-codesign --config-only
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -type f
          cd ios && pod install
      - name: Debug - verify App Store Connect auth env vars are present
        script: |
          echo "ISSUER_ID set: ${APP_STORE_CONNECT_ISSUER_ID:+yes} (length: ${#APP_STORE_CONNECT_ISSUER_ID})"
          echo "KEY_IDENTIFIER value: $APP_STORE_CONNECT_KEY_IDENTIFIER"
          echo "PRIVATE_KEY set: ${APP_STORE_CONNECT_PRIVATE_KEY:+yes} (length: ${#APP_STORE_CONNECT_PRIVATE_KEY})"
          echo "PRIVATE_KEY first line: $(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | head -1)"
          echo "PRIVATE_KEY last line: $(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | tail -1)"
      - name: Fetch (or create) signing certificate and provisioning profile
        script: |
          openssl genrsa -out /tmp/certificate_key.pem 2048
          app-store-connect fetch-signing-files af.digital.girls.school \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/certificate_key.pem
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
