workflows:
  ios-release:
    name: iOS Release (App Store Connect)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI Admin
    environment:
      vars:
        APP_STORE_APPLE_ID: 6799480851
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Re-enable code signing for Release config (undo GitHub Actions unsigned-build override)
        script: |
          sed -i '' '/CODE_SIGNING_ALLOWED=NO/d; /CODE_SIGNING_REQUIRED=NO/d; /CODE_SIGN_IDENTITY=$/d' ios/Flutter/Release.xcconfig
          cat ios/Flutter/Release.xcconfig
      - name: Generate iOS Flutter config (Generated.xcconfig)
        script: |
          flutter precache --ios
          flutter build ios --release --no-codesign --config-only
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -type f
          cd ios && pod install
      - name: Fetch (or create) signing certificate and provisioning profile
        script: |
          # Each CI run generates a fresh throwaway private key, so any Distribution
          # certificate left behind by a previous run can never be reused (its private
          # key no longer exists) and would just block --create with a 409 conflict.
          # Revoke stale Distribution certs first so every run starts from a clean slate.
          EXISTING_CERT_IDS=$(app-store-connect certificates list --type DISTRIBUTION --json 2>/dev/null | python3 -c "import json,sys; data=json.load(sys.stdin); print(chr(10).join(c['id'] for c in data))" 2>/dev/null || echo "")
          for CERT_ID in $EXISTING_CERT_IDS; do
            echo "Revoking stale Distribution certificate: $CERT_ID"
            app-store-connect certificates delete "$CERT_ID" --ignore-not-found || true
          done

          openssl genrsa -out /tmp/certificate_key.pem 2048
          app-store-connect fetch-signing-files af.digital.girls.school \
            --platform IOS \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/certificate_key.pem
      - name: Import signing certificate into keychain
        script: |
          keychain initialize
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: Android Release (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # این چهار متغیر باید در Codemagic → این workflow → Environment
      # variables، به‌عنوان یک گروه رمزنگاری‌شده (مثلاً به‌نام
      # "android_signing") تعریف شوند — نه در این فایل، چون این فایل در
      # گیت است. مقدارها از همان android/key.properties محلی (که عمداً در
      # .gitignore است) و همان upload-keystore.jks گرفته می‌شوند:
      #   CM_KEYSTORE            → خودِ فایل upload-keystore.jks را در
      #                            Codemagic از نوع "File" آپلود کنید؛
      #                            Codemagic خودش مسیرش را در $CM_KEYSTORE می‌گذارد.
      #   CM_KEYSTORE_PASSWORD    → همان storePassword در key.properties
      #   CM_KEY_ALIAS            → همان keyAlias در key.properties
      #   CM_KEY_PASSWORD         → همان keyPassword در key.properties
      groups:
        - android_signing
      vars:
        PACKAGE_NAME: "af.digital.girls.school"
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Rebuild android/key.properties from encrypted signing vars
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE
          EOF
      - name: Build App Bundle (Play Store)
        script: flutter build appbundle --release
      - name: Build APK (direct/manual distribution)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
    # انتشار خودکار به Play Console عمداً فعال نیست — درخواست تولید اندروید
    # فقط شامل ساختنِ AAB/APK بود. اگر بعداً خواستید آپلود خودکار به کانال
    # Internal/Production فعال شود، یک Google Cloud Service Account با
    # دسترسیِ Play Console API لازم است؛ فایل .aab را فعلاً از artifacts
    # همین build در Codemagic دانلود و دستی در Play Console آپلود کنید.
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
